# Runs on every push to main.
# 1) If data / model code changed: retrain + re-evaluate, commit models/ and reports/
# 2) Always: regenerate Counselling-Unit-Support-Assistant.md (stats, results, files, change log with date+time)
name: Update project file

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-project
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    env:
      TZ: Africa/Cairo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Did data or model code change?
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED=$(git ls-files)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          fi
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(data/|core/|train\.py|evaluate\.py|config\.py|requirements\.txt)'; then
            echo "retrain=true" >> "$GITHUB_OUTPUT"
          else
            echo "retrain=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retrain and evaluate
        if: steps.changes.outputs.retrain == 'true'
        run: |
          pip install -r requirements.txt
          python train.py
          python evaluate.py || echo "GATE_FAILED=1" >> "$GITHUB_ENV"
          python -m pytest -q || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"

      - name: Rebuild project MD
        run: python tools/build_project_md.py

      - name: Commit updates
        run: |
          git config user.name "project-bot"
          git config user.email "project-bot@users.noreply.github.com"
          git add Counselling-Unit-Support-Assistant.md models reports
          if git diff --cached --quiet; then
            echo "Nothing to update"
          else
            git commit -m "docs: auto-update project MD $(date '+%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail if crisis gate or tests failed
        if: env.GATE_FAILED == '1' || env.TESTS_FAILED == '1'
        run: |
          echo "::error::Crisis-recall gate or tests FAILED - see reports/metrics.json and Counselling-Unit-Support-Assistant.md"
          exit 1
